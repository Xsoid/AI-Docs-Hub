services:
  docs-site:
    image: node:22-alpine
    working_dir: /workspace/docs-site
    volumes:
      - .:/workspace
    ports:
      - "${DOCS_PORT:-4321}:4321"
    environment:
      HOME: /workspace
      ASTRO_TELEMETRY_DISABLED: "1"
      npm_config_cache: /workspace/.npm-cache
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
